specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ligher
    network: sepolia
    source:
      address: "0x30D3A1Bc456c6449EFfC83bEe9055B5B0607853B"
      abi: ligher
      startBlock: 9393893
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - OwnershipTransferred
        - QuotaUpgraded
        - RentPriceUpdated
        - TicketDestroyed
        - TicketRentedWithTBA
      abis:
        - name: ligher
          file: ./abis/ligher.json
      eventHandlers:
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: QuotaUpgraded(indexed address,indexed uint256,indexed address,string,uint256)
          handler: handleQuotaUpgraded
        - event: RentPriceUpdated(uint256,uint256)
          handler: handleRentPriceUpdated
        - event: TicketDestroyed(indexed address,indexed uint256,indexed address,string,uint256)
          handler: handleTicketDestroyed
        - event: TicketRentedWithTBA(indexed address,indexed uint256,indexed address,bytes32,uint256)
          handler: handleTicketRentedWithTBA
      file: ./src/ligher.ts
