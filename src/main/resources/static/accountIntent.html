<!DOCTYPE html>
<link rel="shortcut icon" href="/favicon.ico">
<html>
<head>
    <title>Create Intent</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link href="/main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="/accountIntent.js"></script>
    <script src="/js/common.js"></script>
</head>
<body>
<noscript><h2 style="color: #ff0000">Enable Javascript to view this page</h2></noscript>
<div id="main-content" class="container">
    <div class="row">
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="connect">WebSocket connection:</label>
                    <button id="connect" class="btn btn-default" type="submit">Connect</button>
                    <button id="disconnect" class="btn btn-default" type="submit" disabled="disabled">Disconnect
                    </button>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <form class="form-horizontal">
                <div class="form-group">
                    <label for="nftId">nftId: </label>
                    <input type="text" value="ex3b3fe32d99e8deab263eab27c074fbd1eaefd20cab330f255f25834081079921360000BB" id="nftId" class="form-control" placeholder="">
                </div>
                <div class="form-group">
                    <label for="tba">tba: </label>
                    <input type="text" value="aaa" id="tba" class="form-control" placeholder="userId" readonly>
                </div>
                <div class="form-group">
                    <label for="chainId">chainId: </label>
                    <input type="text" value="11155111" id="chainId" class="form-control" placeholder="userId" readonly>
                </div>
                <div class="form-group">
                    <label for="expiryTime">expiryTime: </label>
                    <input type="text" value="1760355495" id="expiryTime" class="form-control" placeholder="userId" readonly>
                </div>
                <div class="form-group">
                    <label for="pubkey">Pubkey: </label>
                    <input type="text" value="cccd79f81439ff794cf5ac5f7bff9121e257f399829e472c7a14d3e86fe76984" id="pubkey" class="form-control" placeholder="pubkey" readonly>
                </div>
                <div class="form-group">
                    <label for="content">Content: </label>
                    <input type="text" value="Custom Content" id="content" class="form-control" placeholder="content in markdown...">
                </div>
                <input type="hidden" id="kind" name="kind" value=30080>
                <button id="send" class="btn btn-default" type="submit">Send</button>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table id="conversation" class="table table-striped">
                <thead>
                <tr>
                    <th>Events</th>
                </tr>
                </thead>
                <tbody id="events">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('.btn-group button').click(function() {
            var group = $(this).data('group');
            if (group == "side") {
                // 获取被点击按钮的值
                var value = $(this).data('value');
                // 设置到隐藏字段
                $('#side').val(value);

                $('.btn-group button[data-group="' + group + '"]').removeClass('active');
                $(this).addClass('active');
            }else if(group=="currency") {
                var value1 = $(this).data('value1');
                var value2 = $(this).data('value2');
                // 设置到隐藏字段
                $('#symbol').val(value1);
                $('#token_addr').val(value2);

                $('.btn-group button[data-group="' + group + '"]').removeClass('active');
                $(this).addClass('active');
            }else if(group == "token"){
                // 获取被点击按钮的值
                var value = $(this).data('value');
                // 设置到隐藏字段
                $('#token').val(value);

                $('.btn-group button[data-group="' + group + '"]').removeClass('active');
                $(this).addClass('active');
            }else if(group == "paymentMethod"){
                // 切换点击按钮的 active 类
                $(this).toggleClass('active');

                // 获取所有选中按钮的值
                var selectedValues = [];
                $('.btn-group button[data-group="' + group + '"].active').each(function() {
                    selectedValues.push($(this).data('value'));
                });

                // 将选中的值拼接成一个字符串
                $('#paymentMethod').val(selectedValues.join(','));
            }


        });
    });
</script>
</body>
</html>
