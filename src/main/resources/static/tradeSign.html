<!DOCTYPE html>
<link rel="shortcut icon" href="/favicon.ico">
<html>
<head>
    <title>Create Intent</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link href="/main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="/tradeSign.js"></script>
    <script src="/js/common.js"></script>
</head>
<body>
<noscript><h2 style="color: #ff0000">Enable Javascript to view this page</h2></noscript>
<div id="main-content" class="container">
    <div class="row">
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="connect">WebSocket connection:</label>
                    <button id="connect" class="btn btn-default" type="submit">Connect</button>
                    <button id="disconnect" class="btn btn-default" type="submit" disabled="disabled">Disconnect
                    </button>
                </div>
                <div class="form-group">
                    <label for="eventId">eventId</label>
                    <input type="text" id="eventId" name="eventId" class="form-control">
                </div>
                <div class="form-group">
                    <label for="tradeId">tradeId</label>
                    <input type="text" id="tradeId" name="tradeId" class="form-control">
                </div>
                <div class="form-group">
                    <label for="walletAddress">walletAddress: </label>
                    <input type="text" value="0xD58382f295f5c98BAeB525FAbb7FEBcCc62bc63B" id="walletAddress" class="form-control" placeholder="userId" readonly>
                </div>
                <div class="form-group">
                    <label for="domainAppName">domainAppName: </label>
                    <input type="text" value="MainnetUserTxn" id="domainAppName" class="form-control" placeholder="userId" readonly>
                </div>
                <div class="form-group">
                    <label for="domainVersion">domainVersion: </label>
                    <input type="text" value="1" id="domainVersion" class="form-control" placeholder="userId" readonly>
                </div>
                <div class="form-group">
                    <label for="contractAddress">contractAddress: </label>
                    <input type="text" value="0xecd4fff6ea02f004143f9cf0b9546964800b16aa" id="contractAddress" class="form-control" placeholder="userId" readonly>
                </div>
                <div class="form-group">
                    <label for="sign">sign: </label>
                    <input type="text" value="0x86b9a740df5924391d37ee0fa7ebd1351834d6c76016c0bc6e8298ce43a814d520a5fbe549a50e7da6192a0696aedb42e2e2a99a9dbb96f274f665109c0a81951b" id="sign" class="form-control" placeholder="userId" readonly>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <form class="form-horizontal">
                <input type="hidden" id="pubkey" name="pubkey" value="aaad79f81439ff794cf5ac5f7bff9121e257f399829e472c7a14d3e86fe76984">
                <input type="hidden" id="kind" name="kind" value="30079">
                <input type="hidden" id="content" name="content" value="escrow created">
                <button id="send" class="btn btn-default" type="submit">Send</button>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table id="conversation" class="table table-striped">
                <thead>
                <tr>
                    <th>Events</th>
                </tr>
                </thead>
                <tbody id="events">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('.btn-group button').click(function() {
            var group = $(this).data('group');
            if (group == "side") {
                // 获取被点击按钮的值
                var value = $(this).data('value');
                // 设置到隐藏字段
                $('#side').val(value);

                $('.btn-group button[data-group="' + group + '"]').removeClass('active');
                $(this).addClass('active');
            }else if(group=="currency") {
                var value1 = $(this).data('value1');
                var value2 = $(this).data('value2');
                // 设置到隐藏字段
                $('#symbol').val(value1);
                $('#token_addr').val(value2);

                $('.btn-group button[data-group="' + group + '"]').removeClass('active');
                $(this).addClass('active');
            }else if(group == "token"){
                // 获取被点击按钮的值
                var value = $(this).data('value');
                // 设置到隐藏字段
                $('#token').val(value);

                $('.btn-group button[data-group="' + group + '"]').removeClass('active');
                $(this).addClass('active');
            }else if(group == "paymentMethod"){
                // 切换点击按钮的 active 类
                $(this).toggleClass('active');

                // 获取所有选中按钮的值
                var selectedValues = [];
                $('.btn-group button[data-group="' + group + '"].active').each(function() {
                    selectedValues.push($(this).data('value'));
                });

                // 将选中的值拼接成一个字符串
                $('#paymentMethod').val(selectedValues.join(','));
            }


        });
    });
</script>
</body>
</html>
